name: Unit Tests

# The UnitTests scheme (`mise run test:unit`). It builds only frameworks and test bundles, signed ad hoc
# (no TUIST_TEAM_ID). The only secret is the Tuist token, for the binary cache of the external
# packages; without it (a pull request from a fork) the tests still run, building everything from source.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR or branch supersedes the running tests.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: /bin/bash --noprofile --norc -euo pipefail {0}

jobs:
  unit-tests:
    name: Unit Tests
    # GitHub's image with Xcode 27 (in preview); the macos-26 image stops at Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Tuist.swift pins exactly Xcode 27.2; the image defaults to 27.1.
      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      # The Swift packages `tuist install` resolves (sources and their git mirrors): about a minute to fetch
      # on a fresh runner. Keyed by the resolved versions; a partial hit still saves most of the fetch.
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: Tuist/.build
          key: tuist-packages-${{ runner.os }}-${{ hashFiles('Tuist/Package.resolved', 'Tuist/Package.swift') }}
          restore-keys: tuist-packages-${{ runner.os }}-

      # Installs the tools mise.toml pins.
      - name: mise
        uses: jdx/mise-action@v5

      # Only TUIST_TOKEN, not `fnox exec`: that would also set TUIST_TEAM_ID, and the tests would then need
      # an Apple signing identity this runner doesn't have. fnox's output isn't masked like a secret is.
      - name: Tuist token
        env:
          FNOX_AGE_KEY: ${{ secrets.FNOX_AGE_KEY }}
        run: |
          if [[ -z "${FNOX_AGE_KEY}" ]]; then
            echo "No FNOX_AGE_KEY (a fork's pull request): no binary cache, everything builds from source."
            exit 0
          fi
          token="$(fnox get -P ci TUIST_TOKEN)"
          echo "::add-mask::${token}"
          echo "TUIST_TOKEN=${token}" >> "${GITHUB_ENV}"

      - name: Unit tests
        run: mise run test:unit

      # After the tests, so a broken main doesn't spend time uploading. Pull requests only read the cache.
      - name: Warm the Tuist cache
        if: ${{ github.ref == 'refs/heads/main' && env.TUIST_TOKEN != '' }}
        run: mise run cache:warm
