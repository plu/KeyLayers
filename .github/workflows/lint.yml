name: Lint

# SwiftLint (strict) and SwiftFormat in lint mode (every file formatted): the two halves of `mise run lint`.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR or branch supersedes the running check.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: /bin/bash --noprofile --norc -euo pipefail {0}

jobs:
  lint:
    name: Lint
    # SwiftLint loads SourceKit from the selected Xcode; any recent one will do, so the standard
    # image is enough (the release needs xcode-27 for Tuist's pinned Xcode).
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Installs the tools mise.toml pins, so CI lints with the same versions as local runs.
      - name: mise
        uses: jdx/mise-action@v5

      # Separate steps, so a failure says which check it was.
      - name: SwiftLint
        run: mise run lint:swiftlint

      - name: SwiftFormat
        if: ${{ !cancelled() }}
        run: mise run lint:swiftformat
